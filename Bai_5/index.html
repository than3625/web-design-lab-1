<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> Bài 5 - Image + Text</title>
    </head>
    <body>
        <h1>Khám phá thiên nhiên</h1>
        <article>
            <figure>
                <img src="images/mountain.jpg" alt="Ngọn núi tuyết hùng vĩ" width="400">
                <figcaption>Khoảnh khắc hùng vĩ của đỉnh núi tuyết vươn mình đón những tia nắng sớm mai. Sắc trắng tinh khôi của băng giá hòa quyện cùng bầu trời bao la, được khắc họa trọn vẹn qua từng con chữ, mang lại cảm giác nên thơ và khoáng đạt cho người thưởng lãm.</figcaption>
            </figure>
        </article>
        <article>
            <figure>
                <img src="images/ocean.jpg" alt="Biển xanh mênh mông" width="400">
                <figcaption>Biển xanh mênh mông, nơi những con sóng vỗ về bờ cát trắng, tạo nên một bức tranh thiên nhiên sống động. Hình ảnh này không chỉ gợi lên sự bình yên mà còn khơi dậy cảm giác tự do, khiến tâm hồn người xem như được thả trôi theo nhịp điệu của biển cả.</figcaption>
            </figure>
        </article>
    </body>
</html>
